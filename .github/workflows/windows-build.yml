name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile app.py winapi.py

      - name: Build portable package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyType-Windows
          path: dist/KeyType-1.0.0-win64.zip
          if-no-files-found: error
